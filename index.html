<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="レシピ検索">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>我が家のレシピ検索</title>
</head>
<body>
  <main class="wrap">
    <h1 id="headline">今日の晩ごはん 🍳</h1>
    <p class="sub" id="subheadline"></p><div class="total-recipes" id="totalRecipes"></div>
    <div class="grid">
      <section class="card">
        <div class="field"><label id="label-ingredient" for="ingredient"></label><select id="ingredient"></select></div>
        <div class="field"><label id="label-keyword" for="keyword"></label><input id="keyword" type="search" placeholder="例：パエリア、サーモン、味噌"></div>
        <div class="twocol">
          <div class="field"><label id="label-carb" for="carb"></label><select id="carb"></select></div>
          <div class="field"><label id="label-richness" for="richness"></label><select id="richness"></select></div>
          <div class="field"><label id="label-temperature" for="temperature"></label><select id="temperature"></select></div>
        </div>
        <button class="btn" id="search"></button>
<div class="count" id="count"></div>
      </section>
      <section class="card" id="results"><div class="empty">読み込み中...</div></section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
