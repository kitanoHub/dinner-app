<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="晩ごはん">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>今日の晩ごはん</title>
  <style>
    :root {
      --bg:#f7f5f0; --card:#ffffff; --text:#252525; --muted:#6d6d6d;
      --accent:#2f6f4e; --accent2:#e7f1eb; --border:#ddd9d0;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:860px;margin:auto;padding:18px}
    h1{font-size:28px;margin:8px 0 4px}
    .sub{color:var(--muted);margin:0 0 18px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
    label,legend{font-weight:650}
    textarea{width:100%;min-height:92px;margin-top:9px;padding:12px;border-radius:12px;border:1px solid var(--border);font:inherit;font-size:16px;background:#fff}
    .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
    .chip input{position:absolute;opacity:0;pointer-events:none}
    .chip span{display:inline-flex;align-items:center;min-height:44px;padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:#fff}
    .chip input:checked+span{border-color:var(--accent);background:var(--accent2);font-weight:700}
    fieldset{border:0;padding:0;margin:18px 0 0}
    button{width:100%;min-height:50px;border:0;border-radius:13px;background:var(--accent);color:white;font-size:16px;font-weight:750;margin-top:18px}
    button.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
    .empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
    .food{font-size:72px;line-height:1}
    .title{font-size:24px;font-weight:800;margin:10px 0 4px}
    .badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
    .badge{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:6px 9px}
    .match{background:#f3f6f2;border-radius:12px;padding:11px;margin:12px 0;font-size:14px}
    ol{padding-left:22px;line-height:1.7}
    .alt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .mini{border:1px solid var(--border);border-radius:12px;padding:10px;font-size:14px}
    .section-label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
    .note{font-size:12px;color:var(--muted);margin-top:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>今日の晩ごはん 🍳</h1>
    <p class="sub">冷蔵庫の食材と気分から、今夜の候補を決めます。</p>

    <div class="grid">
      <section class="card">
        <label for="ingredients">冷蔵庫にあるもの</label>
        <textarea id="ingredients" placeholder="例：豚肉、キャベツ、ねぎ、卵、豆腐"></textarea>

        <fieldset>
          <legend>気分</legend>
          <div class="opts">
            <label class="chip"><input type="radio" name="mood" value="さっぱり" checked><span>さっぱり</span></label>
            <label class="chip"><input type="radio" name="mood" value="こってり"><span>こってり</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>主食</legend>
          <div class="opts">
            <label class="chip"><input type="radio" name="base" value="米" checked><span>🍚 米</span></label>
            <label class="chip"><input type="radio" name="base" value="麺"><span>🍜 麺</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>辛さ</legend>
          <div class="opts">
            <label class="chip"><input type="radio" name="spice" value="なし" checked><span>辛くない</span></label>
            <label class="chip"><input type="radio" name="spice" value="少し"><span>🌶 少し</span></label>
            <label class="chip"><input type="radio" name="spice" value="辛い"><span>🌶🌶 辛い</span></label>
          </div>
        </fieldset>

        <button id="go">晩ごはんを決める</button>
        <button id="again" class="secondary" type="button">別の候補を見る</button>
        <p class="note">※ 調味料は一般的な家庭にあるものを一部前提にしています。</p>
      </section>

      <section class="card" id="result" aria-live="polite">
        <div class="empty">
          <div class="food">🍽️</div>
          <p>食材と好みを選ぶと、ここに料理とレシピが出ます。</p>
        </div>
      </section>
    </div>
  </main>

<script>
const RECIPES = [{"name": "豚しゃぶおろし丼", "emoji": "🥢", "mood": "さっぱり", "base": "米", "spice": "なし", "time": 20, "ingredients": ["豚肉", "大根", "ねぎ", "キャベツ", "ポン酢"], "pantry": ["塩"], "steps": ["鍋に湯を沸かし、豚肉を色が変わるまでさっとゆでる。", "ご飯に千切りキャベツをのせる。", "豚肉、大根おろし、ねぎをのせる。", "ポン酢を回しかけて完成。"]}, {"name": "鶏塩レモン丼", "emoji": "🍋", "mood": "さっぱり", "base": "米", "spice": "なし", "time": 20, "ingredients": ["鶏肉", "ねぎ", "レモン", "キャベツ"], "pantry": ["塩", "こしょう", "鶏ガラ"], "steps": ["鶏肉を一口大に切り、塩こしょうする。", "フライパンで両面をこんがり焼く。", "ねぎ、レモン汁、鶏ガラ少量を加える。", "ご飯にのせて黒こしょうを振る。"]}, {"name": "豚キムチ丼", "emoji": "🌶️", "mood": "こってり", "base": "米", "spice": "辛い", "time": 15, "ingredients": ["豚肉", "キムチ", "ねぎ", "卵"], "pantry": ["醤油", "ごま油"], "steps": ["豚肉をごま油で炒める。", "キムチを加えて強火で炒める。", "醤油を少量加えて味を整える。", "ご飯にのせ、好みで卵黄とねぎをのせる。"]}, {"name": "豆腐そぼろ丼", "emoji": "🍚", "mood": "さっぱり", "base": "米", "spice": "少し", "time": 15, "ingredients": ["豆腐", "ひき肉", "ねぎ"], "pantry": ["醤油", "砂糖", "鶏ガラ", "豆板醤"], "steps": ["ひき肉を炒め、豆板醤を少量加える。", "豆腐を崩して加える。", "醤油、砂糖、鶏ガラで味を整える。", "ご飯にのせ、ねぎを散らす。"]}, {"name": "卵と野菜の中華あんかけ丼", "emoji": "🥚", "mood": "こってり", "base": "米", "spice": "なし", "time": 15, "ingredients": ["卵", "キャベツ", "白菜", "きのこ", "ねぎ"], "pantry": ["醤油", "鶏ガラ", "片栗粉"], "steps": ["野菜を食べやすく切って炒める。", "水、鶏ガラ、醤油を加えて煮る。", "溶き卵を流し入れる。", "水溶き片栗粉でとろみをつけ、ご飯にかける。"]}, {"name": "ねぎ塩豚うどん", "emoji": "🍜", "mood": "さっぱり", "base": "麺", "spice": "なし", "time": 15, "ingredients": ["豚肉", "ねぎ", "うどん", "キャベツ"], "pantry": ["塩", "こしょう", "鶏ガラ", "ごま油"], "steps": ["豚肉とねぎを炒める。", "水と鶏ガラを加える。", "うどんを入れて温める。", "塩こしょう、ごま油少量で仕上げる。"]}, {"name": "梅しそ冷やしうどん", "emoji": "🌿", "mood": "さっぱり", "base": "麺", "spice": "なし", "time": 10, "ingredients": ["うどん", "梅", "大葉", "きゅうり"], "pantry": ["めんつゆ"], "steps": ["うどんをゆで、冷水で締める。", "梅をたたき、大葉ときゅうりを切る。", "うどんに具材をのせる。", "めんつゆをかけて完成。"]}, {"name": "濃厚ごま担々麺", "emoji": "🌶️🍜", "mood": "こってり", "base": "麺", "spice": "辛い", "time": 20, "ingredients": ["ひき肉", "ねぎ", "麺", "ごま", "豆乳"], "pantry": ["味噌", "鶏ガラ", "ラー油", "醤油"], "steps": ["ひき肉を味噌と醤油で炒める。", "鍋に水、鶏ガラ、ごま、豆乳を入れて温める。", "麺をゆでてスープに入れる。", "肉味噌、ねぎ、ラー油をのせる。"]}, {"name": "カルボナーラ風うどん", "emoji": "🧀", "mood": "こってり", "base": "麺", "spice": "なし", "time": 12, "ingredients": ["卵", "牛乳", "チーズ", "ベーコン", "うどん"], "pantry": ["塩", "黒こしょう"], "steps": ["ベーコンを炒める。", "温めたうどんを加える。", "火を止め、卵、チーズ、牛乳少量を混ぜる。", "黒こしょうを多めに振る。"]}, {"name": "鶏だし塩ラーメン風", "emoji": "🍜", "mood": "さっぱり", "base": "麺", "spice": "少し", "time": 18, "ingredients": ["鶏肉", "麺", "ねぎ", "卵"], "pantry": ["鶏ガラ", "塩", "ごま油", "ラー油"], "steps": ["鶏肉を小さめに切って煮る。", "鶏ガラ、塩でスープを整える。", "麺をゆでてスープに入れる。", "ねぎと卵をのせ、辛くするならラー油を少量。"]}, {"name": "鮭バター醤油丼", "emoji": "🐟", "mood": "こってり", "base": "米", "spice": "なし", "time": 18, "ingredients": ["鮭", "きのこ", "ねぎ"], "pantry": ["バター", "醤油", "こしょう"], "steps": ["鮭をフライパンで焼く。", "きのこを加えて炒める。", "バターと醤油で味付けする。", "ご飯にのせ、ねぎを散らす。"]}, {"name": "ツナ卵さっぱり丼", "emoji": "🥗", "mood": "さっぱり", "base": "米", "spice": "なし", "time": 10, "ingredients": ["ツナ", "卵", "きゅうり", "ねぎ"], "pantry": ["醤油", "酢", "ごま"], "steps": ["卵を炒り卵にする。", "きゅうりを薄切りにする。", "醤油と酢を混ぜて簡単なたれを作る。", "ご飯にツナ、卵、きゅうりをのせ、たれをかける。"]}];
let ranked = [];
let cursor = 0;

function tokens(s) {
  return s.toLowerCase().replace(/[、，]/g, ',').split(/[\s,]+/).map(v=>v.trim()).filter(Boolean);
}
function val(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}
function overlap(input, list) {
  return list.filter(k => input.some(i => i.includes(k.toLowerCase()) || k.toLowerCase().includes(i)));
}
function rankRecipes() {
  const input = tokens(document.getElementById('ingredients').value);
  if (!input.length) {
    alert('冷蔵庫にある食材を1つ以上入れてください。');
    return false;
  }
  const mood = val('mood'), base = val('base'), spice = val('spice');
  ranked = RECIPES.map(r => {
    let score = 0;
    if (r.mood === mood) score += 6;
    if (r.base === base) score += 6;
    if (r.spice === spice) score += 4;
    else if (spice === '少し' && ['なし','辛い'].includes(r.spice)) score += 1;
    const hits = overlap(input, r.ingredients);
    score += hits.length * 4;
    return {...r, hits, score, tie:Math.random()};
  }).sort((a,b)=> b.score-a.score || b.hits.length-a.hits.length || a.tie-b.tie);
  cursor = 0;
  render(ranked[cursor]);
  return true;
}
function render(r) {
  const result = document.getElementById('result');
  const hitText = r.hits.length ? r.hits.join('・') : '完全一致は少なめ';
  result.innerHTML = `
    <div class="section-label">今日のおすすめ</div>
    <div class="food">${r.emoji}</div>
    <div class="title">${r.name}</div>
    <div class="badges">
      <span class="badge">⏱ ${r.time}分</span>
      <span class="badge">${r.mood}</span>
      <span class="badge">${r.base}</span>
      <span class="badge">${r.spice === 'なし' ? '辛くない' : r.spice === '少し' ? '少し辛い' : '辛い'}</span>
    </div>
    <div class="match"><strong>使えそうな食材：</strong>${hitText}</div>
    <div class="section-label">主な材料</div>
    <p>${r.ingredients.join('、')}</p>
    <div class="section-label">作り方</div>
    <ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    <div class="section-label">あると便利な調味料</div>
    <p>${r.pantry.join('、')}</p>
    <div class="section-label">次の候補</div>
    <div class="alt">
      ${ranked.slice(1,3).map(x=>`<div class="mini">${x.emoji} <strong>${x.name}</strong><br><span style="color:var(--muted)">${x.time}分</span></div>`).join('')}
    </div>
  `;
}
document.getElementById('go').addEventListener('click', rankRecipes);
document.getElementById('again').addEventListener('click', () => {
  if (!ranked.length) { rankRecipes(); return; }
  cursor = (cursor + 1) % Math.min(ranked.length, 6);
  render(ranked[cursor]);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
