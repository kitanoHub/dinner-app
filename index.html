function fill(id,arr){const el=document.getElementById(id);el.innerHTML=arr.map(v=>`<option value="${v}">${v}</option>`).join('')}
fill('ingredient',['指定なし',...INGREDIENTS]);for(const k of ['base','richness','temperature','spice','flavor','special'])fill(k,FILTERS[k]);
const toks=s=>s.toLowerCase().replace(/[、，]/g,',').split(/[\s,]+/).map(v=>v.trim()).filter(Boolean);
function scoreRecipe(r){
 let score=0, matched=[];
 const ingredient=document.getElementById('ingredient').value;
 const base=document.getElementById('base').value;
 const richness=document.getElementById('richness').value;
 const temperature=document.getElementById('temperature').value;
 const spice=document.getElementById('spice').value;
 const flavor=document.getElementById('flavor').value;
 const special=document.getElementById('special').value;
 const free=toks(document.getElementById('free').value);
 if(ingredient!=='指定なし'&&r.main_ingredients.includes(ingredient)){score+=10;matched.push('食材')}
 if(base!=='指定なし'&&r.base.includes(base)){score+=7;matched.push('タイプ')}
 if(richness!=='指定なし'&&r.richness===richness){score+=5;matched.push('重さ')}
 if(temperature!=='指定なし'&&r.temperature.includes(temperature)){score+=5;matched.push('温度')}
 if(spice!=='指定なし'&&r.spice===spice){score+=5;matched.push('辛さ')}
 if(flavor!=='指定なし'&&r.flavors.some(x=>x.includes(flavor)||flavor.includes(x))){score+=6;matched.push('味')}
 if(special!=='指定なし'&&(r.tags.includes(special)||r.flavors.includes(special))){score+=6;matched.push('特徴')}
 if(free.length){const hit=[...r.main_ingredients,...r.proteins,...r.tags].filter(x=>free.some(f=>x.toLowerCase().includes(f)||f.includes(x.toLowerCase())));score+=hit.length*4;if(hit.length)matched.push('冷蔵庫')}
 return {...r,score,matched};
}
function render(){
 const active=['ingredient','base','richness','temperature','spice','flavor','special'].some(id=>document.getElementById(id).value!=='指定なし')||document.getElementById('free').value.trim();
 let ranked=RECIPES.map(scoreRecipe).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ja'));
 if(active) ranked=ranked.filter(r=>r.score>0);
 document.getElementById('count').textContent=`登録 ${RECIPES.length}件 / 表示 ${ranked.length}件`;
 const top=ranked.slice(0,8);
 document.getElementById('results').innerHTML=top.length?top.map(r=>`<article class="recipe"><div class="rhead"><div class="emoji">${r.emoji}</div><div><div class="name">${r.name}</div><div class="badges"><span class="badge">${r.base.join('・')}</span><span class="badge">${r.temperature.join('・')}</span><span class="badge">${r.richness}</span><span class="badge">${r.spice}</span>${r.servings?`<span class="badge">${r.servings}</span>`:''}<span class="badge">約${r.time}分</span></div><div class="score">${active?`マッチスコア ${r.score} / ${r.matched.join('・')}`:'登録レシピ'}</div></div></div><div class="sectiontitle">使う食材</div><div class="pillrow">${r.main_ingredients.map(x=>`<span class="pill">${x}</span>`).join('')}</div><details class="details"><summary>レシピを見る</summary><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></details></article>`).join(''):'<div class="empty">この条件に合うレシピがありません。条件を1つ減らしてみてください。</div>';
}
document.getElementById('search').addEventListener('click',render);
document.getElementById('reset').addEventListener('click',()=>{for(const id of ['ingredient','base','richness','temperature','spice','flavor','special'])document.getElementById(id).selectedIndex=0;document.getElementById('free').value='';render()});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
